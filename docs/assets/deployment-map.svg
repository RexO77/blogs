<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Deployment workflow</title>
  <desc id="description">The repository builds into a public folder that can be deployed to any static host.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="1200" height="360" fill="#F8F7F3"/>
  <rect x="0" y="0" width="12" height="360" fill="#0099FF"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="52" y="58" fill="#1a1a1a" font-size="25" font-weight="700">One build. Any static host.</text>
    <text x="1148" y="57" text-anchor="end" fill="#666666" font-size="13">OUTPUT: public/</text>
    <path d="M52 84H1148" stroke="#1a1a1a"/>

    <g transform="translate(52 132)">
      <text fill="#666666" font-size="12" font-weight="700">SOURCE</text>
      <text y="39" fill="#1a1a1a" font-size="20" font-weight="700">Repository</text>
      <text y="70" fill="#666666" font-size="14">Content, layouts, config</text>
    </g>

    <path d="M270 182H358" stroke="#1a1a1a" marker-end="url(#arrow)"/>

    <g transform="translate(378 120)">
      <rect width="242" height="94" fill="#1a1a1a"/>
      <text x="20" y="28" fill="#BDBDBD" font-size="12" font-weight="700">BUILD</text>
      <text x="20" y="65" fill="#F8F7F3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">./build.sh</text>
    </g>

    <path d="M640 182H728" stroke="#1a1a1a" marker-end="url(#arrow)"/>

    <g transform="translate(748 120)">
      <rect width="160" height="94" fill="#FFD700"/>
      <text x="20" y="28" fill="#665600" font-size="12" font-weight="700">OUTPUT</text>
      <text x="20" y="65" fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">public/</text>
    </g>

    <path d="M928 182H982" stroke="#1a1a1a" marker-end="url(#arrow)"/>

    <g transform="translate(1002 118)">
      <text fill="#666666" font-size="12" font-weight="700">HOST</text>
      <text y="32" fill="#1a1a1a" font-size="15">Vercel</text>
      <text y="55" fill="#1a1a1a" font-size="15">Cloudflare Pages</text>
      <text y="78" fill="#1a1a1a" font-size="15">Netlify</text>
      <text y="101" fill="#1a1a1a" font-size="15">GitHub Pages</text>
    </g>

    <path d="M52 292H1148" stroke="#1a1a1a"/>
    <text x="52" y="320" fill="#666666" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">npm ci   ·   Node 20   ·   Hugo Extended 0.156.0+</text>
  </g>
</svg>
