baseURL = "https://blog.nischal.fyi/"
languageCode = "en-us"
title = "My Blog"
enableRobotsTXT = true
canonifyURLs = false

# Output formats (Pagefind builds the search index after Hugo renders the site.)
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[pagination]
  pagerSize = 15

[params]
  # Change these first when you start a new blog.
  description = "A personal blog about ideas worth sharing."
  author = "Your Name"
  authorBio = "Write a short introduction that tells readers who you are and what you write about."
  mainSiteURL = ""
  mainSiteLabel = "Website"
  showAuthorBio = true
  heroHeadline = "A BLOG ABOUT <em>WHAT MATTERS.</em>"

  # SEO
  metaTitle = "My Blog"
  metaDescription = "A personal blog about ideas worth sharing."
  ogImage = "og-default.png"
  twitterCard = "summary_large_image"

  # Social profiles. Leave blank to hide them.
  twitter = ""
  linkedin = ""
  github = ""

  # Analytics. Set these only after connecting your own accounts.
  googleAnalytics = ""
  vercelAnalytics = false

  [params.comments]
    enabled = false
    system = "giscus" # Options: giscus, utterances, disqus

    [params.comments.giscus]
      repo = ""
      repoId = ""
      category = ""
      categoryId = ""
      mapping = "pathname"
      strict = "0"
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "bottom"
      theme = "preferred_color_scheme"
      lang = "en"

    [params.comments.utterances]
      repo = ""
      issueTerm = "pathname"
      theme = "github-light"

    [params.comments.disqus]
      shortname = ""

  [params.newsletter]
    enabled = false
    title = "Stay in the Loop"
    description = "Get new posts delivered to your inbox. No spam, unsubscribe anytime."
    provider = "mailchimp" # Options: mailchimp, convertkit, substack, custom

    [params.newsletter.mailchimp]
      action = ""
      hiddenField = ""

    [params.newsletter.convertkit]
      action = ""
      formId = ""
      uid = ""

    [params.newsletter.substack]
      url = ""

    [params.newsletter.custom]
      action = ""

[build]
  writeStats = true

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false

[caches]
  [caches.images]
    maxAge = "8760h"
  [caches.assets]
    maxAge = "8760h"

[imaging]
  quality = 85
  resampleFilter = "Lanczos"
  hint = "photo"
  anchor = "Smart"

  [imaging.webp]
    quality = 85

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true

[taxonomies]
  category = "categories"
  tag = "tags"

[related]
  threshold = 80
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

[module]
  [module.hugoVersion]
    extended = true
    min = "0.156.0"
